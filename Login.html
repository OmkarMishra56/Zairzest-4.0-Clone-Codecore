<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zairzest Login</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <div class="overlay-text">
        <h1>Enter the untamed wilderness with <span>ZAIRZA</span></h1> 
        <p>Release all your stress with the exciting Tech and Fun events in the most awaited fest, Zairzest 3.0 presented by Zairza.</p>
        <div class="dots">
          <span class="dot active"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>
    <div class="right-panel">
      <h2>Become the Beast of the Cyber Forest</h2>
      <p class="subtext">Sign in to get into Zairzest</p>
      <form class="login-form">
        <input type="email" placeholder="Email here" required>
        <input type="password" placeholder="********" required>
        <div class="links">
          <a href="#"> Reset Password</a>
          <a href="#">Sign Up</a>
        </div>
        <button type="submit" class="login-btn">Login</button>
        <div class="or">or</div>
        <button class="google-btn">Sign in with <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google"></button>
      </form>
    </div>
  </div>
</body>
</html>
